          - {episode: love-event-story-love-24-1114-004, group: 2, choice: 1}
          - {episode: love-event-story-love-24-1114-005, group: 2, choice: 1}
          - {episode: love-event-story-love-24-1114-006, group: 1, choice: 1}
          - {episode: love-event-story-love-24-1114-006, group: 2, choice: 1}
