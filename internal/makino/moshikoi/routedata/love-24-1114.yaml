# Branches follow docs/love-24-1114-routemap.md and the adv_love_2411 scripts.
# Choices use the API's 1-based indices, not the map's 0-based alternatives.
# Favorability weights/ending awards reuse existing-series values as an
# approximation. Yu route points are separate from favorability: they are
# encoded by the four minimum point combinations below, never by these scores.
# The TRUE end-roll asset exists; its association follows the established
# mov_adv_event_2411_02_02_movie-01 naming convention rather than captured RPCs.
loveId: love-24-1114
endingConditions:
  cd-event-love-24-1114-normal-mission_love-end_emb: love-end-love-24-1114-008-happy-001
  cd-event-love-24-1114-limited-mission_love-end_emb-sp: love-end-love-24-1114-008-happy-001
endings:
