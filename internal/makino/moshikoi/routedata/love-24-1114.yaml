      - {index: 2, count: 2, best: 1, scores: [35, -35]}
    outcomes:
      # Despite its 003-bad identifier, this ending occurs in episode4.
      - {all: [{group: 2, choice: 2}], ending: love-end-love-24-1114-003-bad}
    next: love-event-story-love-24-1114-005
  # The legacy 004-bad master row points to missing script love_2411_04_02.
  # It is not part of the supplied playable route; do not alias it to episode4.
  love-event-story-love-24-1114-005:
    groups:
      - {index: 1, count: 2, best: 2, scores: [0, 0]}
      - {index: 2, count: 2, best: 1, scores: [35, -35]}
