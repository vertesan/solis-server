  - {id: love-end-love-24-1114-008-bad-002, name: 泡沫の夢END, favorability: 206}
episodes:
  love-event-story-love-24-1114-001:
    groups:
      - {index: 1, count: 2, scores: [0, 0]}
      - {index: 2, count: 2, scores: [0, 0]}
    next: love-event-story-love-24-1114-002
  love-event-story-love-24-1114-002:
