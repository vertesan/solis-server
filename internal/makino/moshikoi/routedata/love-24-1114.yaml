  - {id: love-end-love-24-1114-008-happy-001, name: TRUEEND, favorability: 2059, endRollAssetId: event_2411_02_02}
  - {id: love-end-love-24-1114-008-happy-002, name: 永遠に君の味方END, favorability: 1441}
  - {id: love-end-love-24-1114-008-happy-003, name: 解釈違いEND, favorability: 1441}
