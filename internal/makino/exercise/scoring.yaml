# Private-server RNG seed, not an extracted official seed. The same seed is
# used on every attempt; captured winning and failing formations are regressions.
seed: 240

# No natural technique criticals were observed in these captured lessons.
# Do not extrapolate this suppression to later lessons: for example lesson22
# explicitly teaches increasing critical chance with accessories and photos.
disableBaseCriticalExercises:
  - exercise-basic-01
  - exercise-basic-02
  - exercise-basic-03
  - exercise-basic-04
  - exercise-basic-05
  - exercise-basic-06
  - exercise-basic-07

# Inferred from traffic/mixed/exercise, including both failing and successful
# runs. Base = sum(floor(attribute * quest weight / 1000)) * K; the coefficients
# fit all 6,870 ordinary beat snapshots, including buffs and criticals.
# The coefficients fit the observed +/-5% jitter; their official derivation is
# unknown. Scope these values to Exercise, not ordinary Quest/Dream lives.
# Other songs retain the Live engine's 8 / ordinary-beat-count approximation.
beatScoreCoefficientPermil:
  music-hsm-001: 57
  music-sun-001: 54
  music-moon-001: 49
  music-hsm-002: 50
  music-hsm-005: 52
  music-tri-001: 57
  music-unit-003: 52
